[package]
name = "lib"
version = "0.1.0"
license = "MIT OR Apache-2.0"
authors = ["ZEROLINGG <bcsz8833221@gmail.com>"]
edition = "2024"

[dependencies]
anyhow = "1.0.104"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5.8"

# base
base64 = "0.23.1"

# aead
chacha20poly1305 = { version = "0.11", features = ["rand_core", "getrandom"] }
# ascon-aead128 0.1.1 声明 ascon ^0.5.0-rc.0，但其预发布版 API（State::new/permute_12）
# 与最终 0.5.0（仅自由函数）不兼容，必须精确锁定 rc.0（RustCrypto 上游打包缺陷）
ascon = "=0.5.0-rc.0"
ascon-aead128 = "0.1.1"

# compress
lz4_flex = "0.14"
zstd = "0.13.3"

# hash
sha1 = "0.11"
sha2 = "0.11"
hex = "0.4"
digest = "0.11"

# kdf
hkdf = "0.13"

# http
httparse = "1.10.1"
bytes = "1.12.1"


# client only (tokio 运行时 + HTTP 客户端，不用于 wasm)
tokio = { version = "1.53.1", features = ["net", "io-util", "time", "rt", "rt-multi-thread", "macros", "sync"], optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "http2"], optional = true }
reqwest-websocket = { version = "0.6.0", optional = true }
futures-util = { version = "0.3", optional = true }
async-stream = { version = "0.3", optional = true }

# client only (MITM TLS，不用于 wasm)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"], optional = true }
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring", "x509-parser"], optional = true }
moka = { version = "0.12", optional = true, features = ["sync"] }
time = { version = "0.3", optional = true }
ipnetwork = { version = "0.21.1", optional = true }
dirs = { version = "6", optional = true }
rand = { version = "0.10", optional = true }
machine-uid = { version = "0.6.0", optional = true }

postcard = { version = "1.1", features = ["alloc"] }

# 统一日志
tracing = { version = "0.1", features = ["attributes"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "env-filter", "fmt", "ansi"], optional = true }
rolling-file = { version = "0.2", optional = true }

[features]
default = ["client"]

# 本地客户端：tokio 运行时 + HTTP 客户端 + MITM TLS + 统一日志(终端+1MB轮转文件)
client = ["dep:tokio", "dep:reqwest", "dep:futures-util", "dep:async-stream", "dep:rustls", "dep:tokio-rustls", "dep:rcgen", "dep:moka", "dep:time", "dep:ipnetwork", "dep:reqwest-websocket", "dep:dirs", "dep:rand", "dep:machine-uid", "dep:tracing-subscriber", "dep:rolling-file"]
http3 = ["dep:reqwest", "reqwest/http3"]

# 服务端 (wasm) 构建：纯逻辑，无 tokio
server = []

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
tracing-wasm = { version = "0.2" }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "env-filter"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
x509-parser = "0.18"

[profile.release]
#strip = "symbols"
debug = 0
opt-level = "z"
lto = true
codegen-units = 1