name = "free-proxy"
main = "build/index.js"
compatibility_date = "2026-08-08"
# 关键：compatibility_date >= 2026-03-17 时 websocket_standard_binary_type 默认启用，
# workerd 会把二进制 WS 消息以 Blob 投递，而 worker crate 的 MessageEvent::bytes()
# 只认 ArrayBuffer（Uint8Array::new(blob) 读不出内容）→ 客户端头帧会变成"空消息"。
# 用官方回退标志恢复 ArrayBuffer 投递（worker crate 0.8 按此设计）。
# 已向官方提交修复PR： https://github.com/cloudflare/workers-rs/pull/1049
compatibility_flags = ["no_websocket_standard_binary_type"]

[build]
command = "cargo install -q \"worker-build@^0.8\" && worker-build --release"

[dev]
port = 80

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
