  # ========== Job 5: Worker 服务端 ==========
  build-worker:
    name: Build Worker bundle (zip)
    needs: create-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust (wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './server-rs -> target'

      - name: Install worker-build
        run: cargo install -q "worker-build@^0.8"

      - name: Build Worker bundle
        working-directory: ./server-rs
        run: worker-build --release

      - name: Package zip
        run: |
          set -euo pipefail
          VERSION=${GITHUB_REF_NAME#v}
          STAGE=free-proxy-worker-${VERSION}
          mkdir -p "$STAGE/build"
          cp -r server-rs/build/index.js server-rs/build/index_bg.wasm \
                server-rs/build/package.json server-rs/build/worker "$STAGE/build/"
          awk '!s && /^\[build\]/{s=1; next} s && /^\[/{s=0} !s' \
            server-rs/wrangler.toml > "$STAGE/wrangler.toml"
          if grep -q '^\[build\]' "$STAGE/wrangler.toml"; then
            echo "::error::[build] section not stripped"; exit 1
          fi
          test -f "$STAGE/build/index.js" || { echo "::error::bundle missing"; exit 1; }
          cat > "$STAGE/README.md" <<'EOF'
          # free-proxy Worker
          ## 部署
          1. npm i -g wrangler
          2. 进入本目录: wrangler login && wrangler deploy
          3. 配置密钥(首次):
             wrangler secret put key    # 客户端认证密钥,自定一串字符
             wrangler secret put domain # 你的 Worker 域名,如 free-proxy.xxx.workers.dev
          ## 更新
          下载新版 zip 重新执行 2;密钥已存在则无需重配(第 3 步可跳过)。
          EOF
          zip -r "free-proxy_worker_${VERSION}.zip" "$STAGE"
          echo "ASSET_NAME=free-proxy_worker_${VERSION}.zip" >> "$GITHUB_ENV"

      - name: Upload zip to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: ${{ env.ASSET_NAME }}
